version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    groups:
      root-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /backend/deepseek-proxy
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
