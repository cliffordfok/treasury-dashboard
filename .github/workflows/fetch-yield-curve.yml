name: Fetch FRED Yield Curve

on:
  schedule:
    # 每日 UTC 22:00（美國市場收市後 ~6pm ET）更新一次
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 手動觸發

permissions:
  contents: write

concurrency:
  group: fred-yield-curve
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch yield curve from FRED
        env:
          FRED_API_KEY: ${{ secrets.VITE_FRED_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FRED_API_KEY:-}" ]; then
            echo "::error::Missing repository secret VITE_FRED_API_KEY"
            exit 1
          fi

          SERIES=(DGS1MO DGS3MO DGS6MO DGS1 DGS2 DGS3 DGS5 DGS7 DGS10 DGS20 DGS30)
          YEARS=(0.0833 0.25 0.5 1 2 3 5 7 10 20 30)
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          fetch_series() {
            local series_id="$1"
            local destination="$2"
            local url="https://api.stlouisfed.org/fred/series/observations?series_id=${series_id}&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=10"
            local status attempt

            for attempt in 1 2 3; do
              status="$(curl -sS --retry 2 --retry-delay 5 --retry-all-errors -w '%{http_code}' -o "$destination" "$url" || true)"
              if [ "$status" = "200" ]; then
                if jq -e '.observations | type == "array" and length > 0' "$destination" > /dev/null; then
                  return 0
                fi
                echo "FRED ${series_id} returned an invalid observation payload" >&2
              fi

              echo "FRED ${series_id} returned HTTP ${status} on attempt ${attempt}/3" >&2
              sleep 10
            done

            return 1
          }

          for SERIES_ID in "${SERIES[@]}"; do
            if ! fetch_series "$SERIES_ID" "$TMP_DIR/${SERIES_ID}.json"; then
              echo "::error::FRED ${SERIES_ID} failed after retries"
              exit 1
            fi
          done

          COMMON_DATE=""
          while IFS= read -r CANDIDATE_DATE; do
            HAS_ALL=true
            for SERIES_ID in "${SERIES[@]}"; do
              if ! jq -e --arg date "$CANDIDATE_DATE" '.observations[] | select(.date == $date and .value != ".")' "$TMP_DIR/${SERIES_ID}.json" > /dev/null; then
                HAS_ALL=false
                break
              fi
            done
            if [ "$HAS_ALL" = true ]; then
              COMMON_DATE="$CANDIDATE_DATE"
              break
            fi
          done < <(jq -r '.observations[] | select(.value != ".") | .date' "$TMP_DIR/${SERIES[0]}.json")

          if [ -z "$COMMON_DATE" ]; then
            echo "::error::FRED returned no common observation date across all 11 tenors"
            exit 1
          fi

          CURVE_FILE="$TMP_DIR/curve.json"
          echo '{"points":[' > "$CURVE_FILE"
          FIRST=true
          POINTS=0

          for i in "${!SERIES[@]}"; do
            SERIES_ID="${SERIES[$i]}"
            VALUE="$(jq -r --arg date "$COMMON_DATE" '.observations[] | select(.date == $date and .value != ".") | .value' "$TMP_DIR/${SERIES_ID}.json" | head -n 1)"
            if [ -z "$VALUE" ]; then
              echo "::error::FRED ${SERIES_ID} has no value for ${COMMON_DATE}"
              exit 1
            fi
            if [ "$FIRST" = true ]; then FIRST=false; else echo ',' >> "$CURVE_FILE"; fi
            jq -n \
              --arg id "$SERIES_ID" \
              --argjson years "${YEARS[$i]}" \
              --argjson yield "$VALUE" \
              --arg date "$COMMON_DATE" \
              '{id: $id, years: $years, yield: $yield, date: $date}' >> "$CURVE_FILE"
            POINTS=$((POINTS+1))
          done

          echo '],"observationDate":"'"$COMMON_DATE"'","updatedAt":"'"$COMMON_DATE"'"}' >> "$CURVE_FILE"

          if [ "$POINTS" -ne "${#SERIES[@]}" ]; then
            echo "::error::FRED returned ${POINTS}/${#SERIES[@]} usable yield curve points"
            exit 1
          fi

          jq -e --arg date "$COMMON_DATE" \
            '(.points | length) == 11 and ([.points[].date] | unique) == [$date] and .observationDate == $date and .updatedAt == $date' \
            "$CURVE_FILE" > /dev/null

          mkdir -p public
          cp "$CURVE_FILE" public/yield-curve.json
          echo "Generated yield-curve.json with ${POINTS} points for ${COMMON_DATE}:"
          cat public/yield-curve.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/yield-curve.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update yield-curve.json"
            git push
          fi
